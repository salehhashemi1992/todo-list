
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .completed   { text-decoration: line-through; color:#888; }
        .todo-container { max-width:600px; margin:50px auto; }
        .todo-item  { display:flex; align-items:center; padding:10px; margin:5px 0;
                      background:#f8f9fa; border-radius:5px; }
        .todo-item:hover { background:#e9ecef; }
        /* خط جداکننده برای شمارنده‌ها */
        #stats{ font-size:0.9rem; color:#555; margin-bottom:1rem; }
    </style>
</head>
<body>
<div class="container todo-container">
    <h1 class="text-center mb-2">Todo List</h1>
    <div id="stats" class="text-center mb-2">Completed: 0 &nbsp;|&nbsp; Remaining: 0</div>

    <div class="input-group mb-3">
        <input type="text" class="form-control" id="todoInput" placeholder="Add a new task">
        <button class="btn btn-primary" type="button" onclick="addTodo()">Add</button>
    </div>

    <ul class="list-unstyled" id="todoList"></ul>
    <button class="btn btn-danger mt-3" onclick="clearAll()">Clear All Tasks</button>
</div>

<script>
/* ---------- داده‌ها ---------- */
let todos = [];

/* ---------- افزودن ---------- */
function addTodo() {
    const inp = document.getElementById('todoInput');
    const text = inp.value.trim();
    if (!text) return;

    const todo = { id: Date.now(), text, completed:false };
    todos.push(todo);
    inp.value = '';
    updateUI();
}

/* ---------- ساخت آیتم ---------- */
function createTodoElement(todo){
    const li = document.createElement('li');
    li.className = 'todo-item';
    li.dataset.id = todo.id;

    /* محتوای پویا */
    li.innerHTML = `
        <input type="checkbox" class="form-check-input me-2"
               ${todo.completed ? 'checked':''}
               onchange="toggleComplete(${todo.id})">
        <span class="${todo.completed?'completed':''} flex-grow-1"
              ondblclick="enableEdit(${todo.id})">${todo.text}</span>
        <button class="btn btn-danger btn-sm ms-2"
                onclick="deleteTodo(${todo.id})">Delete</button>
    `;
    return li;
}

/* ---------- ویرایش متن ---------- */
function enableEdit(id){
    const liSpan = document.querySelector(\`li[data-id="\${id}"] span\`);
    if (!liSpan) {
        console.warn(`Span element not found for todo item ${id}. Possibly already in edit mode or item removed.`);
        return;
    }
    const oldText = liSpan.innerText;

    /* جایگزینی input */
    const input = document.createElement('input');
    input.type  = 'text';
    input.className = 'form-control';
    input.value = oldText;
    input.style.flexGrow = '1';

    /* ذخیره در blur یا Enter */
    input.addEventListener('blur', ()=>saveEdit(id,input));
    input.addEventListener('keypress', e=>{
        if(e.key==='Enter') input.blur();
    });

    // Only proceed if liSpan is valid
    if (liSpan) {
        liSpan.replaceWith(input);
        input.focus();
    }
}

function saveEdit(id, inputEl){
    const newText = inputEl.value.trim();
    if (newText){
        todos = todos.map(t=> t.id===id ? {...t,text:newText}:t);
    }
    updateUI();
}

/* ---------- تغییر وضعیت ---------- */
function toggleComplete(id){
    todos = todos.map(t=> t.id===id ? ({...t,completed:!t.completed}) : t);
    updateUI();
}

/* ---------- حذف ---------- */
function deleteTodo(id){
    todos = todos.filter(t=>t.id!==id);
    updateUI();
}

/* ---------- پاک‌کردن همه ---------- */
function clearAll(){
    todos = [];
    updateUI();
}

/* ---------- شمارنده ---------- */
function updateStats(){
    const done = todos.filter(t=>t.completed).length;
    const remaining = todos.length - done;
    document.getElementById('stats').innerText =
        \`Completed: \${done}  |  Remaining: \${remaining}\`;
}

/* ---------- رندر UI ---------- */
function updateUI(){
    const ul = document.getElementById('todoList');
    ul.innerHTML = '';
    todos.forEach(t=>ul.appendChild(createTodoElement(t)));
    updateStats();
}

/* ---------- ورودی Enter ---------- */
document.getElementById('todoInput').addEventListener('keypress',e=>{
    if(e.key==='Enter') addTodo();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
